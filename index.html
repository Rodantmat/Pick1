<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#04526d">
  <title>WorkFlex Demo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="appRoot">
    <section class="screen active" id="splashScreen" aria-label="Splash screen">
      <img src="splash.png" class="screen-img" alt="Splash">
      <div class="loader-wrap" aria-hidden="true">
        <div class="loader-track"></div>
        <div class="loader-fill" id="loaderFill"></div>
      </div>
    </section>

    <section class="screen" id="updatesScreen" aria-label="Updates screen">
      <img src="updates.png" class="screen-img" alt="Updates">
      <div class="tap-capture" id="updatesTapCapture"></div>
    </section>

    <section class="screen" id="pickupScreen" aria-label="Pickup screen">
      <img src="pickup.png" class="screen-img" alt="Pickup">
      <div class="tap-capture" id="pickupTapCapture"></div>
    </section>

    <section class="menu-shell" id="menuShell" aria-label="Menu overlay">
      <div class="menu-dim" id="menuDim"></div>
      <div class="menu-panel" id="menuPanel">
        <img src="menu.png" class="screen-img" alt="Menu">
        <button class="menu-close-hit" id="menuClose" type="button" aria-label="Close menu"></button>
        <button class="menu-go-pickup-hit" id="menuGoPickup" type="button" aria-label="Open pickup"></button>
      </div>
    </section>

    <section class="camera-shell" id="cameraShell" aria-label="Camera overlay">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <button class="camera-close" id="cameraClose" type="button" aria-label="Close camera">×</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
