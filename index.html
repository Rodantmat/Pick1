<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#04526d">
  <title>WorkFlex Demo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <section class="screen is-active" id="screenSplash">
      <img class="frame-img" src="screen-splash-raw.png" alt="Splash">
      <div class="top-mask splash-mask"></div>
      <div class="splash-bar-cover"></div>
      <div class="live-loader" aria-hidden="true">
        <div class="live-loader-track">
          <div class="live-loader-fill" id="loaderFill"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="screenUpdates">
      <img class="frame-img" src="screen-updates-raw.png" alt="Updates">
      <div class="top-mask teal-mask"></div>
      <button class="tap-layer" id="updatesTap" aria-label="Open menu"></button>
    </section>

    <section class="screen" id="screenPickup">
      <img class="frame-img" src="screen-pickup-raw.png" alt="Pickup">
      <div class="top-mask teal-mask"></div>
      <button class="menu-button-hit" id="pickupMenuTap" aria-label="Open menu"></button>
      <button class="pickup-camera-hit" id="pickupCameraTap" aria-label="Open camera"></button>
      <button class="pickup-anywhere-hit" id="pickupAnywhereTap" aria-label="Open camera anywhere"></button>
    </section>

    <aside class="menu-shell" id="menuShell" aria-hidden="true">
      <div class="menu-backdrop" id="menuBackdrop"></div>
      <div class="menu-panel">
        <img class="frame-img" src="screen-menu-raw.png" alt="Menu">
        <div class="top-mask teal-mask"></div>
        <button class="menu-close-hit" id="menuClose" aria-label="Close menu"></button>
        <button class="menu-main-hit" id="menuMainHit" aria-label="Open scan route screen"></button>
      </div>
    </aside>

    <section class="camera-shell" id="cameraShell" aria-hidden="true">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <button class="camera-close" id="cameraClose" aria-label="Close camera">×</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
