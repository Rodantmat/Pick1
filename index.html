<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#04526d">
  <title>WorkFlex Demo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="screen active" id="splashScreen">
      <img src="splash.png" class="screen-img" alt="Splash">
      <div class="loader-wrap">
        <div class="loader-track"><div class="loader-fill" id="loaderFill"></div></div>
      </div>
    </section>

    <section class="screen" id="updatesScreen">
      <img src="updates.png" class="screen-img" alt="Updates">
      <button class="full-hit" id="updatesOpenMenu" aria-label="Open menu"></button>
    </section>

    <section class="screen" id="pickupScreen">
      <img src="pickup.png" class="screen-img" alt="Pickup">
      <button class="menu-hit" id="pickupOpenMenu" aria-label="Open menu"></button>
      <button class="camera-hit" id="pickupOpenCamera" aria-label="Open camera"></button>
      <button class="full-hit" id="pickupOpenCameraAnywhere" aria-label="Open camera anywhere"></button>
    </section>

    <div class="menu-shell" id="menuShell">
      <div class="menu-dim" id="menuDim"></div>
      <div class="menu-panel" id="menuPanel">
        <img src="menu.png" class="screen-img" alt="Menu">
        <button class="menu-close-hit" id="menuClose" aria-label="Close menu"></button>
        <button class="menu-go-pickup-hit" id="menuGoPickup" aria-label="Go to pickup"></button>
      </div>
    </div>

    <section class="camera-shell" id="cameraShell">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <button class="camera-close" id="cameraClose" aria-label="Close camera">×</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
