<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#04526d">
  <title>WorkFlex</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="screen active" id="screenSplash" aria-label="Splash screen">
      <img src="screen-splash.png" alt="Splash" class="screen-image">
      <div class="splash-loader" aria-hidden="true">
        <div class="splash-loader-track">
          <div class="splash-loader-fill" id="splashLoaderFill"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="screenUpdates" aria-label="Updates screen">
      <img src="screen-updates.png" alt="Updates" class="screen-image">
      <button class="hotspot updates-anywhere-hotspot" id="openMenuUpdates" aria-label="Open menu"></button>
    </section>

    <section class="screen" id="screenPickup" aria-label="Pick up screen">
      <img src="screen-pickup.png" alt="Pick up" class="screen-image">
      <button class="hotspot menu-hotspot" id="openMenuPickup" aria-label="Open menu"></button>
      <button class="hotspot camera-hotspot" id="openCamera" aria-label="Scan route code"></button>
      <button class="hotspot pickup-anywhere-hotspot" id="openCameraAnywhere" aria-label="Open camera"></button>
    </section>

    <aside class="menu-layer" id="menuLayer" aria-hidden="true">
      <img src="screen-menu.png" alt="Menu" class="menu-image">
      <button class="hotspot menu-select-pickup" id="menuSelectPickup" aria-label="Open pick up screen"></button>
      <button class="hotspot menu-close-hotspot" id="closeMenu" aria-label="Close menu"></button>
      <button class="hotspot menu-item-itinerary" data-target="updates" aria-label="Today's itinerary"></button>
      <button class="hotspot menu-item-pickup" data-target="pickup" aria-label="Pick up"></button>
      <button class="hotspot menu-item-updates" data-target="updates" aria-label="Updates"></button>
      <button class="hotspot menu-item-schedule" data-target="updates" aria-label="Schedule"></button>
      <button class="hotspot menu-backdrop-hotspot" id="menuBackdropHotspot" aria-label="Close menu"></button>
    </aside>

    <section class="camera-layer" id="cameraLayer" aria-hidden="true">
      <video id="cameraFeed" autoplay playsinline muted></video>
      <button class="camera-close" id="closeCamera" aria-label="Close camera">×</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
